# Vale configuration for MagicBlock documentation

StylesPath = .vale/styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure, code

Vocab = Mintlify

# This is required since Vale doesn't officially support MDX
[formats]
mdx = md

# MDX support
[*.mdx]
BasedOnStyles = Vale
# Terms only enforces vocab casing; this is a spellcheck, so keep it off
Vale.Terms = NO

# Token and block ignores for MDX-specific syntax
TokenIgnores = (?m)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>), \
(<[^>]*>), \
\{(?!/\*)[^}]*\}, \
(`[^`]*`), \
(?m)^openapi: .+$, \
([\w-]+\.)+(?:json|jsonl|png|jpe?g|gif|svg|mdx?|txt|ya?ml|xml|com|dev|io|ts|js|tsx|jsx), \
[\w-]+="[^"\n]*", \
[\w.+-]+@[\w.-]+, \
\(/[^)\s]*\)

BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({(?!/\*).+?})$, \
(?sm)^[ \t]*```[\s\S]*?```$

CommentDelimiters = {/*, */}

# Machine-translated locales: skip English prose linting
[**/cn/**]
BasedOnStyles = ""

[**/jp/**]
BasedOnStyles = ""

[**/ko/**]
BasedOnStyles = ""
