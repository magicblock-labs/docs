name: X conversions Worker

on:
  pull_request:
    paths:
      - 'workers/x-conversions/**'
      - 'x-pixel.js'
      - '.github/workflows/deploy-x-conversions.yml'
  push:
    branches: [main]
    paths:
      - 'workers/x-conversions/**'
      - 'x-pixel.js'
      - '.github/workflows/deploy-x-conversions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/x-conversions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/x-conversions/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/x-conversions-build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: x-conversions-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/x-conversions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/x-conversions/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
